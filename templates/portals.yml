# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.
#   ✅ https://careers.mastercard.com   ⚠️ https://mastercard.wd1.myworkdayjobs.com (fallback only)
#   ✅ https://openai.com/careers       ⚠️ https://job-boards.greenhouse.io/openai (fallback only)
#   Exception: ATS-hosted careers_url is acceptable when no branded careers page exists.
#   Using raw ATS URLs when a branded page exists can cause false 410 errors (job ID mismatch).
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Location filter (optional) --
# Filter scanned jobs by location. Applied AFTER title filter, BEFORE dedup.
# If this entire block is absent, all locations pass (current default behavior).
#
# Semantics:
#   - Empty location string on a job → pass (don't penalize missing data)
#   - Any `block` keyword present → reject (takes precedence over allow)
#   - `allow` empty → pass (already cleared block)
#   - `allow` non-empty → must match at least one keyword
# All matches are case-insensitive substring.
#
# Example below targets US-based remote + a couple of US metros, blocking
# common foreign hubs. Customize to your geography.

# location_filter:
#   allow:
#     - "Remote"
#     - "United States"
#     - "USA"
#     - "Atlanta"
#     - "New York"
#   block:
#     - "India"
#     - "Bengaluru"
#     - "United Kingdom"
#     - "London"
#     - "Germany"
#     - "France"
#     - "Singapore"
#     - "Japan"
#     - "Brazil"
#     - "Australia"

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # [CUSTOMIZE] Add keywords matching YOUR target roles
    # -- AI/ML roles --
    - "AI"
    - "ML"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "GenAI"
    - "Generative AI"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    - "Machine Learning"
    - "Applied AI"
    - "Applied ML"
    - "Deep Learning"
    - "Computer Vision"
    - "RAG"
    - "LangChain"
    - "LangGraph"
    # -- Engineering & deployment roles --
    - "Platform Engineer"
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Automation Engineer"
    - "AI Platform"
    - "ML Platform"
    # -- DevRel / DX --
    - "Developer Advocate"
    - "DevRel"
    - "Developer Experience"
    - "Software Engineer"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    # -- Non-technical / business roles --
    - "Product Manager"
    - "Program Manager"
    - "Project Manager"
    - "Business Analyst"
    - "Financial Analyst"
    - "Data Analyst"
    - "Recruiter"
    - "Account Executive"
    - "Account Manager"
    - "Sales Manager"
    - "Marketing Manager"
    - "Technical Writer"
    - "UX Designer"
    - "UI Designer"
    - "Product Designer"
    # -- Hardware / infra roles --
    - "Network Engineer"
    - "Hardware Engineer"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    # -- Out-of-stack languages (title-level signal) --
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "COBOL"
    - "Mainframe"
    # -- Domains outside target --
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    # -- Seniority / type exclusions --
    - "Intern"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Mid"
    - "Mid-Level"
    - "Junior"

location_filter:
  allow:
    # US remote variants
    - "Remote"
    - "United States"
    - "USA"
    - "Anywhere in the US"
    - "US Remote"
    - "Remote, US"
    - "Remote - US"
    - "Remote (US)"
    # Major tech-hub cities (catches "New York, NY" style listings)
    - "New York"
    - "San Francisco"
    - "Bay Area"
    - "Seattle"
    - "Austin"
    - "Boston"
    - "Chicago"
    - "Los Angeles"
    - "Atlanta"
    - "Denver"
    - "Miami"
    - "Raleigh"
    - "Dallas"
    - "Houston"
    # State abbreviations (catches ", NY" / ", CA" suffixes)
    - ", NY"
    - ", CA"
    - ", WA"
    - ", TX"
    - ", MA"
    - ", IL"
    - ", GA"
    - ", CO"
    - ", FL"
    - ", NC"
    - ", VA"
    - ", DC"
  block:
    - "India"
    - "Bengaluru"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "France"
    - "Singapore"
    - "Japan"
    - "Brazil"
    - "Australia"
    - "Canada"
    - "Netherlands"
    - "Poland"
    - "Israel"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # -- Ashby --
  - name: Ashby — Solutions Architect
    query: 'site:jobs.ashbyhq.com "Solutions Architect" AI OR automation remote'
    enabled: true

  - name: Ashby — AI Engineer
    query: 'site:jobs.ashbyhq.com "AI Engineer" OR "LLM Engineer" OR "Forward Deployed" remote'
    enabled: true

  - name: Ashby — Agentic
    query: 'site:jobs.ashbyhq.com "Agentic" OR "AI Agent" OR "Automation Architect" remote'
    enabled: true

  - name: Ashby — Software Engineer
    query: 'site:jobs.ashbyhq.com "Software Engineer"'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — SA & FDE
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Solutions Architect" OR "Forward Deployed" AI remote'
    enabled: true

  - name: Greenhouse — AI Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "AI Engineer" OR "LLM" OR "Agentic" remote'
    enabled: true

  - name: Greenhouse — Software Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Software Engineer"'
    enabled: true

  # -- Workable --
  - name: Workable — AI Roles
    query: 'site:apply.workable.com "AI Engineer" OR "ML Engineer" OR "Solutions Architect" OR "LLM" remote'
    enabled: true

  - name: Workable — Software Engineer
    query: 'site:apply.workable.com "Software Engineer"'
    enabled: true

  # -- Workday --
  - name: Workday — AI Engineer
    query: 'site:myworkdayjobs.com "AI Engineer" OR "ML Engineer" OR "LLM Engineer" OR "Applied AI" remote'
    enabled: true

  - name: Workday — Agentic & LLMOps
    query: 'site:myworkdayjobs.com "Agentic" OR "LLMOps" OR "AI Platform" OR "GenAI" OR "Generative AI"'
    enabled: true

  - name: Workday — Solutions Architect & FDE
    query: 'site:myworkdayjobs.com "Solutions Architect" OR "Forward Deployed" OR "Solutions Engineer" AI'
    enabled: true

  - name: Workday — Software Engineer AI
    query: 'site:myworkdayjobs.com "Software Engineer" "AI" OR "Machine Learning" OR "LLM"'
    enabled: true

  - name: Workday — MLOps & Platform
    query: 'site:myworkdayjobs.com "MLOps" OR "ML Platform" OR "AI Infrastructure" OR "AI Platform Engineer"'
    enabled: true

  # -- FDE specific (cross-portal) --
  - name: FDE & Deployed Engineer — All portals
    query: '"Forward Deployed Engineer" OR "Deployed Engineer" OR "Deployment Engineer" AI site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co'
    enabled: true

  # -- Remote job boards --

  - name: WeWorkRemotely — AI & DX
    query: 'site:weworkremotely.com "AI" OR "DevRel" OR "Solutions Engineer" OR "Forward Deployed" OR "Founding Engineer"'
    enabled: true

  - name: Working Nomads — AI/DevRel/SA
    query: 'site:workingnomads.com "AI Engineer" OR "Developer Advocate" OR "Solutions Architect" OR "Forward Deployed"'
    enabled: true

  - name: RemoteOK — AI/DevRel/SA
    query: 'site:remoteok.com "AI Engineer" OR "Developer Advocate" OR "Solutions Architect" OR "Forward Deployed" OR "Founding Engineer"'
    enabled: true

  # -- Lever --

  - name: Lever — AI & ML Engineer
    query: 'site:jobs.lever.co "AI Engineer" OR "ML Engineer" OR "Machine Learning Engineer" OR "LLM Engineer" OR "Applied AI" remote'
    enabled: true

  - name: Lever — Solutions & FDE
    query: 'site:jobs.lever.co "Solutions Architect" OR "Forward Deployed" OR "Solutions Engineer" AI remote'
    enabled: true

  - name: Lever — Software Engineer
    query: 'site:jobs.lever.co "Software Engineer"'
    enabled: true

  # -- YC / Startup boards --

  - name: YC Jobs — AI Engineer/SA/FDE
    query: 'site:ycombinator.com/jobs OR site:workatastartup.com "AI Engineer" OR "ML Engineer" OR "Forward Deployed" OR "Solutions Architect" remote'
    enabled: true

  - name: YC Jobs — Software Engineer
    query: 'site:ycombinator.com/jobs OR site:workatastartup.com "Software Engineer"'
    enabled: true

  # -- Aggregators --

  - name: Himalayas — Remote AI/Dev-tools
    query: 'site:himalayas.app "AI Engineer" OR "Solutions Architect" OR "Developer Advocate" OR "Forward Deployed" OR "Founding Engineer"'
